[project]
name = "techkraft-backend"
version = "0.1.0"
description = "TechKraft candidate scoring and review dashboard API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "email-validator>=2.2.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "bcrypt>=4.2.0",
    "pydantic-settings>=2.14.1",
    "python-jose[cryptography]>=3.5.0",
    "redis[asyncio]>=8.0.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
seed = "app.seed:main"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis[aioredis]>=2.36.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
