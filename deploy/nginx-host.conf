# Host nginx — proxies public traffic to the frontend container on 127.0.0.1:8080.
# Install: sudo cp /srv/techkraft/deploy/nginx-host.conf /etc/nginx/sites-available/techkraft
#
# Two blocks on :80:
#   1) default_server for bare IP — always proxy (no SSL on IP)
#   2) domain — certbot adds HTTPS redirect + :443 SSL; keep this block for HTTP→HTTPS

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 4.230.32.12 _;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name pywithaayush.tech www.pywithaayush.tech;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
