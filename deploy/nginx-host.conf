# Host nginx — proxies public :80/:443 to the frontend container on 127.0.0.1:8080.
# Install: sudo cp /srv/techkraft/deploy/nginx-host.conf /etc/nginx/sites-available/techkraft

server {
    listen 80;
    server_name pywithaayush.tech www.pywithaayush.tech 4.230.32.12;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
